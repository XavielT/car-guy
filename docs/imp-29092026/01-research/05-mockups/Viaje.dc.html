<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio · Viaje en curso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Rajdhani',sans-serif;background:#121212;color:#EDEDED}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #EDEDED; display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 80px 20px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Saira Condensed', sans-serif; font-size: 11px; letter-spacing: 0.18em; color: #FFB300">CAR GUY <span style="font-family: 'Noto Sans JP', sans-serif; color: #8C8C8C; letter-spacing: 0; font-size: 10px">車</span></div>
      <div style="font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">TABLERO</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-family: 'Saira Condensed', sans-serif; font-size: 11px; letter-spacing: 0.14em; color: #FF4D45"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E10600; box-shadow: 0 0 8px #E10600"></span>REC</div>
  </div>

  <div style="display: flex; gap: 8px">
    <span style="padding: 8px 12px; border-radius: 10px; background: #1B1B1B; border: 1px solid #2A2A2A; color: #B3B3B3; font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.08em">CITROËN DS3 2015</span>
    <span style="padding: 8px 12px; border-radius: 10px; background: #FFB300; color: #121212; font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.08em">EL TRUENO</span>
  </div>

  <!-- cluster in speed mode -->
  <div style="border-radius: 18px; border: 1px solid #2A2A2A; background: #171717; padding: 14px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative">
    <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'Saira Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.06em">EL TRUENO <span style="margin-left: 6px; font-size: 10px; letter-spacing: 0.12em; color: #B3B3B3; border: 1px solid #3A3A3A; padding: 2px 6px; border-radius: 4px">VIAJE</span></div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C8C8C">GPS ● bueno</div>
    </div>
    <svg width="300" height="190" viewBox="0 0 300 190" style="display: block">
      <defs>
        <linearGradient id="arcv" x1="0" x2="1"><stop offset="0" stop-color="#3DDC84"/><stop offset="0.55" stop-color="#FFB300"/><stop offset="1" stop-color="#FF6A00"/></linearGradient>
      </defs>
      <!-- track -->
      <path d="M 30 170 A 120 120 0 1 1 270 170" fill="none" stroke="#2A2A2A" stroke-width="16" stroke-linecap="round"/>
      <!-- redline from 120 -->
      <path d="M 232 82 A 120 120 0 0 1 270 170" fill="none" stroke="#E10600" stroke-width="16" stroke-linecap="butt"/>
      <!-- speed fill to 84 km/h -->
      <path d="M 30 170 A 120 120 0 0 1 185 46" fill="none" stroke="url(#arcv)" stroke-width="16" stroke-linecap="round"/>
      <!-- ticks -->
      <g font-family="Saira Condensed" font-size="13" fill="#EDEDED" font-weight="600">
        <text x="38" y="150">0</text><text x="52" y="90">40</text><text x="110" y="52">80</text><text x="176" y="52">120</text><text x="236" y="90" fill="#FF4D45">160</text><text x="246" y="150" fill="#FF4D45">200</text>
      </g>
      <!-- needle at 84 -->
      <line x1="150" y1="150" x2="188" y2="52" stroke="#FF6A00" stroke-width="4" stroke-linecap="round"/>
      <circle cx="150" cy="150" r="12" fill="#121212" stroke="#FFB300" stroke-width="3"/>
      <!-- big number -->
      <text x="150" y="128" text-anchor="middle" font-family="Saira Condensed" font-weight="800" font-size="46" fill="#EDEDED">84</text>
      <text x="150" y="146" text-anchor="middle" font-family="Rajdhani" font-size="11" letter-spacing="2" fill="#8C8C8C">KM/H</text>
    </svg>
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.12em; color: #FFB300; background: #0E0E0E; border: 1px solid #2A2A2A; border-radius: 8px; padding: 6px 16px">012.4 <span style="font-size: 12px; color: #8C8C8C; letter-spacing: 0.05em">KM</span></div>
    <div style="font-family: 'Rajdhani', sans-serif; font-size: 10px; letter-spacing: 0.16em; color: #8C8C8C">VIAJE · TOCA PARA TIEMPO / MEDIA / MÁX</div>
    <div style="display: flex; gap: 8px; margin-top: 4px">
      <span style="font-family: 'Saira Condensed', sans-serif; font-size: 10px; letter-spacing: 0.12em; color: #3DDC84; border: 1px solid #2A2A2A; padding: 3px 8px; border-radius: 4px">GPS</span>
      <span style="font-family: 'Saira Condensed', sans-serif; font-size: 10px; letter-spacing: 0.12em; color: #FF4D45; border: 1px solid #2A2A2A; padding: 3px 8px; border-radius: 4px">● REC</span>
      <span style="font-family: 'Saira Condensed', sans-serif; font-size: 10px; letter-spacing: 0.12em; color: #5A5A5A; border: 1px solid #2A2A2A; padding: 3px 8px; border-radius: 4px">PASAJERO</span>
    </div>
    <div style="font-family: 'Rajdhani', sans-serif; font-size: 10px; color: #5A5A5A">GPS · no sustituye el velocímetro</div>
  </div>

  <!-- trip in progress card -->
  <div style="border-radius: 14px; border: 1px solid #2A2A2A; background: #1B1B1B; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-family: 'Saira Condensed', sans-serif; font-size: 11px; letter-spacing: 0.18em; color: #FFB300">VIAJE EN CURSO <span style="font-family: 'Noto Sans JP', sans-serif; color: #8C8C8C; letter-spacing: 0; font-size: 10px">走行中</span></div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C8C8C">automático</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px">8:12</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #8C8C8C">desde</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px">25 min</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #8C8C8C">tiempo</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: #FFB300">96</span><span style="font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #8C8C8C">máx km/h</span></div>
    </div>
    <div style="display: flex; gap: 8px">
      <span style="flex: 1; text-align: center; padding: 11px; border-radius: 10px; background: #E10600; color: #FFFFFF; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.1em">TERMINAR</span>
      <span style="flex: 1; text-align: center; padding: 11px; border-radius: 10px; background: #1B1B1B; border: 1px solid #3A3A3A; color: #EDEDED; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.1em">SOY PASAJERO</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #171717; border-top: 1px solid #2A2A2A; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; font-family: 'Saira Condensed', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-align: center; color: #8C8C8C">
    <div style="color: #FFB300">INICIO</div><div>GARAJE</div><div>HISTORIAL</div><div>CIFRAS</div><div>MÁS</div>
  </div>
</div>
</x-dc>
</body>
</html>
